# DHCP for the SoftEther tap_net (subnet 10.21.0.0/19, pool 10.21.0.2-10.21.31.254).
port=0
interface=tap_net
bind-dynamic
dhcp-authoritative
# 10.21.0.0/19 -> 8190 usable addrs, 1h lease; supports >=5000 concurrent sessions.
dhcp-range=10.21.0.2,10.21.31.254,255.255.224.0,1h
dhcp-lease-max=5000
dhcp-option=option:router,10.21.0.1
dhcp-option=option:dns-server,8.8.8.8,1.1.1.1
