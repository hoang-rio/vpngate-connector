# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError

# Parallel execution
org.gradle.parallel=true

# Build cache
org.gradle.caching=true

# Max workers (adjust to match your CPU cores)
org.gradle.workers.max=4

# AndroidX and Jetifier
# Note: android.enableJetifier is deprecated and will be removed in AGP 10.0
# The current default is 'false'
android.useAndroidX=true

# Configuration Cache (renamed from unsafe.configuration-cache in Gradle 7.6+)
org.gradle.configuration-cache=true

# Non-transitive R class
android.nonTransitiveRClass=true

# Dependency constraints
android.dependency.useConstraints=true
# Suppress warning about library constraints performance
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# KSP compatibility with AGP 9.0 built-in Kotlin
android.disallowKotlinSourceSets=false

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.java=true

# R8 settings
# Note: android.r8.optimizedResourceShrinking is deprecated and will be removed in AGP 10.0
# The current default is 'true'
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
